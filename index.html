<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gravity Profile — Blurred Photo Background</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --card-w: 360px;
      --accent-1: #6be7ff;
      --accent-2: #bc79ff;
      --deep-1: #05020a;
      --glass: rgba(255,255,255,0.03);
      --bg-image: url("https://i.ibb.co/0yNGDTV0/2034-Picsart-Ai-Image-Enhancer.jpg");
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial;
      background: var(--deep-1);
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    /* Fullscreen background layer using the user's picture */
    .bg {
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      overflow:hidden;
      display:block;
    }

    /* Blurred photo layer (uses the provided image) */
    .bg::before{
      content:"";
      position:absolute;
      inset:-10%;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center center;
      transform: scale(1.06);
      filter: blur(14px) saturate(1.05) contrast(0.95);
      opacity:0.95;
      will-change: transform, filter;
    }

    /* Soft color wash over the blurred photo to keep contrast readable */
    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(6,6,12,0.45), rgba(8,6,18,0.55));
      mix-blend-mode: multiply;
      pointer-events:none;
    }

    /* subtle moving light band to add life */
    .light-band{
      position:absolute;
      left:-30%;
      top:10%;
      width:160%;
      height:28%;
      background: linear-gradient(90deg, rgba(107,231,255,0.06), rgba(188,121,255,0.06), rgba(255,200,120,0.03));
      filter: blur(28px);
      transform: rotate(-6deg);
      opacity:0.9;
      animation: bandMove 12s ease-in-out infinite;
      pointer-events:none;
      z-index:1;
    }
    @keyframes bandMove {
      0%{ transform: translateX(-6%) rotate(-6deg) }
      50%{ transform: translateX(6%) rotate(-5deg) }
      100%{ transform: translateX(-6%) rotate(-6deg) }
    }

    /* Foreground stage */
    .stage{
      position:relative;
      z-index:10;
      width:100%;
      max-width:1200px;
      display:flex;
      align-items:center;
      justify-content:center;
      perspective:1200px;
      padding:20px;
    }

    /* Card */
    .card{
      width:var(--card-w);
      border-radius:28px;
      padding:28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      box-shadow:
        0 30px 60px rgba(2,6,23,0.6),
        0 6px 18px rgba(0,0,0,0.6);
      position:relative;
      transform-style:preserve-3d;
      transition:transform 400ms cubic-bezier(.2,.9,.3,1), box-shadow 300ms;
      overflow:visible;
      display:flex;
      flex-direction:column;
      align-items:center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    @keyframes floatY {
      0%{ transform: translateY(0px) }
      50%{ transform: translateY(-12px) }
      100%{ transform: translateY(0px) }
    }
    .card.float { animation: floatY 6s ease-in-out infinite; }

    .card:hover{
      transform: rotateX(4deg) rotateY(-4deg) translateY(-6px) scale(1.01);
      box-shadow: 0 40px 80px rgba(2,6,23,0.7);
    }

    /* Round avatar holder (crisp, unblurred) */
    .avatar-wrap{
      width:140px;
      height:140px;
      border-radius:50%;
      padding:6px;
      background: linear-gradient(180deg, rgba(107,231,255,0.08), rgba(188,121,255,0.06));
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.6), inset 0 2px 8px rgba(255,255,255,0.02);
      margin-top:6px;
      position:relative;
      z-index:12;
      backdrop-filter: none;
    }

    .avatar{
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      display:block;
      background:linear-gradient(180deg,#222,#111);
      border: 3px solid rgba(255,255,255,0.04);
    }

    /* Use the same image but keep it sharp inside the avatar */
    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transform-origin:center;
      transition: transform 300ms ease;
      -webkit-user-drag: none;
      user-select: none;
      filter: none;
    }

    .name{
      margin-top:14px;
      color:#fff;
      font-weight:600;
      letter-spacing:2px;
      font-size:1rem;
      text-transform:uppercase;
      text-shadow: 0 6px 18px rgba(188,121,255,0.04);
      z-index:12;
    }

    .social-bar{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:16px;
      width:100%;
      z-index:12;
    }

    .btn{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      border-radius:12px;
      text-decoration:none;
      color:#fff;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      transition: transform 160ms ease, box-shadow 160ms ease, background 220ms;
      font-weight:600;
      font-size:0.95rem;
      justify-content:flex-start;
      box-shadow: 0 6px 18px rgba(2,6,23,0.45);
    }

    .btn i{
      width:34px;
      height:34px;
      display:inline-grid;
      place-items:center;
      border-radius:8px;
      background:rgba(255,255,255,0.03);
      color:var(--accent-1);
      font-size:1rem;
      flex-shrink:0;
    }

    .btn:hover{ transform: translateY(-4px); background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)); }
    .btn:active{ transform: scale(0.98); background: linear-gradient(180deg, var(--accent-2), var(--accent-1)); color:#0b0712; }

    .btn.whatsapp i{ background: linear-gradient(180deg,#25D366,#1FAF4B); color:#fff; }
    .btn.instagram i{ background: radial-gradient(circle at 30% 20%, #ffd, #ff7a7a); color:#fff; }
    .btn.facebook i{ background: linear-gradient(180deg,#3b5998,#2d4373); color:#fff; }

    .contact-pill{
      display:inline-flex;
      gap:10px;
      align-items:center;
      margin-top:14px;
      padding:10px 18px;
      border-radius:999px;
      background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      color:rgba(255,255,255,0.65);
      font-size:0.9rem;
      border:1px solid rgba(255,255,255,0.03);
      box-shadow: 0 6px 18px rgba(2,6,23,0.45);
      z-index:12;
    }

    /* Responsive */
    @media (max-width:880px){
      .card{ width:92vw; max-width:420px; }
    }

    @media (prefers-reduced-motion: reduce){
      .light-band, .card.float { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Background layers: blurred photo + color wash + moving band -->
  <div class="bg" aria-hidden="true">
    <div class="light-band" aria-hidden="true"></div>
  </div>

  <!-- Foreground stage -->
  <div class="stage">
    <div class="card float" id="profileCard" aria-label="Gravity profile card">
      <div class="avatar-wrap" aria-hidden="false">
        <div class="avatar" role="img" aria-label="Profile picture of Dιρ Tαɾαϝԃҽɾ">
          <img src="https://i.ibb.co/0yNGDTV0/2034-Picsart-Ai-Image-Enhancer.jpg"
               alt="Profile picture"
               onerror="this.onerror=null; this.src='https://i.ibb.co/0yNGDTV0/2034-Picsart-Ai-Image-Enhancer.jpg';"
               draggable="false">
        </div>
      </div>

      <div class="name">𝒟𝒾𝓅 𝒯𝒶𝓇𝒶𝒻𝒹𝑒𝓇</div>

      <nav class="social-bar" aria-label="Social links">
        <a class="btn whatsapp" href="https://wa.me/qr/O6ZY5GWHOZNUJ1" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-whatsapp" aria-hidden="true"></i>
          <span>WhatsApp</span>
        </a>

        <a class="btn instagram" href="https://www.instagram.com/diptarafderr?igsh=MWd3c3N2bjZzZGFrbw==" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-instagram" aria-hidden="true"></i>
          <span>Instagram</span>
        </a>

        <a class="btn facebook" href="https://www.facebook.com/share/19E3s37ifs/" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-facebook-f" aria-hidden="true"></i>
          <span>Facebook</span>
        </a>
      </nav>

      <div class="contact-pill" aria-label="Phone number">
        <i class="fas fa-phone" style="color:var(--accent-1)"></i>
        <span style="font-weight:600;color:#fff">01761613854</span>
      </div>
    </div>
  </div>

  <script>
    // Parallax subtle movement for background band and card
    (function(){
      const band = document.querySelector('.light-band');
      const stage = document.querySelector('.stage');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduce) return;

      function onMove(e){
        const x = (e.clientX || (e.touches && e.touches[0].clientX) || innerWidth/2) / innerWidth - 0.5;
        const y = (e.clientY || (e.touches && e.touches[0].clientY) || innerHeight/2) / innerHeight - 0.5;
        band.style.transform = `translate3d(${x * -8}%, ${y * -6}%, 0) rotate(-6deg)`;
        stage.style.transform = `translate3d(${x * 8}px, ${y * 6}px, 0)`;
      }

      window.addEventListener('mousemove', onMove);
      window.addEventListener('touchmove', onMove, {passive:true});
      window.addEventListener('mouseleave', () => {
        band.style.transform = '';
        stage.style.transform = '';
      });
    })();

    // Keep card tilt tactile but not affecting avatar clarity
    (function(){
      const card = document.getElementById('profileCard');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduce) return;

      function handleMove(e){
        const r = card.getBoundingClientRect();
        const x = (e.clientX ?? (e.touches && e.touches[0].clientX)) - r.left;
        const y = (e.clientY ?? (e.touches && e.touches[0].clientY)) - r.top;
        const px = (x / r.width) - 0.5;
        const py = (y / r.height) - 0.5;
        const rx = (py * 8).toFixed(2);
        const ry = (px * -8).toFixed(2);
        card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(6px)`;
      }

      function reset(){
        card.style.transform = '';
      }

      card.addEventListener('mousemove', handleMove);
      card.addEventListener('touchmove', handleMove, {passive:true});
      card.addEventListener('mouseleave', reset);
      card.addEventListener('touchend', reset);
    })();
  </script>
</body>
          </html>
