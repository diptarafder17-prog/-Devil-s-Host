<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gravity Profile — About_Dip (Upper Left)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --card-w: 360px;
      --accent-1: #6be7ff;
      --accent-2: #bc79ff;
      --bg-img: url("https://i.ibb.co/0yNGDTV0/2034-Picsart-Ai-Image-Enhancer.jpg");
      --panel-w: 320px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial;
      background: #05020a;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      overflow:hidden;
    }

    /* Fullscreen background image (sharp source) */
    .bg {
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-image: var(--bg-img);
      background-size:cover;
      background-position:center center;
      transform: scale(1.03);
    }

    /* Blur + color overlay on top of the background image */
    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      backdrop-filter: blur(14px) saturate(1.05) contrast(0.95);
      -webkit-backdrop-filter: blur(14px) saturate(1.05) contrast(0.95);
      background: linear-gradient(180deg, rgba(6,6,12,0.45), rgba(8,6,18,0.55));
      mix-blend-mode: multiply;
      pointer-events:none;
    }

    .bg::before{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(60% 60% at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.45) 100%);
      pointer-events:none;
    }

    /* About button placed upper-left */
    .about-btn {
      position:fixed;
      left:18px;
      top:18px;
      z-index:30;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border:1px solid rgba(255,255,255,0.06);
      color:#fff;
      border-radius:12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      cursor:pointer;
      user-select:none;
      transition: transform 180ms ease, box-shadow 180ms ease, background 220ms;
      backdrop-filter: blur(6px);
    }

    .about-btn:active{ transform: scale(0.98); }
    .about-btn:hover{ transform: translateY(-2px); box-shadow: 0 18px 40px rgba(0,0,0,0.7); }

    .about-btn i{ width:28px; height:28px; display:inline-grid; place-items:center; border-radius:8px; background:rgba(255,255,255,0.03); color:var(--accent-1); }

    /* Slide-in about panel */
    .about-panel {
      position:fixed;
      left: -1px;
      top:0;
      bottom:0;
      width:var(--panel-w);
      max-width:92vw;
      transform: translateX(calc(-100% - 8px));
      z-index:28;
      background: linear-gradient(180deg, rgba(12,10,18,0.98), rgba(8,6,18,0.96));
      border-right: 1px solid rgba(255,255,255,0.04);
      box-shadow: 8px 0 40px rgba(0,0,0,0.6);
      padding:22px;
      display:flex;
      flex-direction:column;
      gap:18px;
      transition: transform 360ms cubic-bezier(.2,.9,.3,1);
      will-change: transform;
      overflow:auto;
    }

    .about-panel.open { transform: translateX(0); }

    .about-header{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .about-header h3{
      margin:0;
      color:#fff;
      font-size:1.05rem;
      letter-spacing:1px;
      font-weight:600;
    }

    .about-close{
      margin-left:auto;
      background:transparent;
      border:none;
      color:rgba(255,255,255,0.7);
      font-size:1.1rem;
      cursor:pointer;
      padding:6px;
      border-radius:8px;
    }
    .about-close:hover{ background: rgba(255,255,255,0.02); }

    .about-content{
      color:rgba(255,255,255,0.9);
      font-size:0.95rem;
      line-height:1.5;
    }

    .about-row{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding:12px;
      border-radius:10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
      border:1px solid rgba(255,255,255,0.02);
    }

    .label{
      min-width:84px;
      color:rgba(255,255,255,0.65);
      font-weight:700;
      font-size:0.85rem;
    }

    .value{
      color:#fff;
      font-weight:600;
      font-size:0.95rem;
      word-break:break-word;
    }

    /* Foreground stage */
    .stage{
      position:relative;
      z-index:10;
      width:100%;
      max-width:1200px;
      display:flex;
      align-items:center;
      justify-content:center;
      perspective:1200px;
    }

    /* Card */
    .card{
      width:var(--card-w);
      border-radius:28px;
      padding:28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      box-shadow:
        0 30px 60px rgba(2,6,23,0.6),
        0 6px 18px rgba(0,0,0,0.6);
      position:relative;
      transform-style:preserve-3d;
      transition:transform 400ms cubic-bezier(.2,.9,.3,1), box-shadow 300ms;
      overflow:visible;
      display:flex;
      flex-direction:column;
      align-items:center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .card:hover{
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 40px 90px rgba(2,6,23,0.75);
    }

    .top-clear { height:8px; width:100%; pointer-events:none; }

    .avatar-wrap{
      width:140px;
      height:140px;
      border-radius:50%;
      padding:6px;
      background: linear-gradient(180deg, rgba(107,231,255,0.08), rgba(188,121,255,0.06));
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.6), inset 0 2px 8px rgba(255,255,255,0.02);
      margin-top:6px;
      position:relative;
      z-index:12;
    }

    .avatar{
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      display:block;
      background:linear-gradient(180deg,#222,#111);
      border: 3px solid rgba(255,255,255,0.04);
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      -webkit-user-drag: none;
      user-select: none;
      transform-origin:center;
      transition: transform 300ms ease;
      filter: none;
    }

    .name{
      margin-top:6px;
      color:#fff;
      font-weight:600;
      letter-spacing:1.5px;
      font-size:1rem;
      text-transform:uppercase;
      z-index:12;
    }

    .social-bar{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:8px;
      width:100%;
      z-index:12;
    }

    .btn{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border-radius:12px;
      text-decoration:none;
      color:#fff;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      transition: transform 160ms ease, box-shadow 160ms ease, background 220ms;
      font-weight:600;
      font-size:0.95rem;
      justify-content:flex-start;
      box-shadow: 0 6px 18px rgba(2,6,23,0.45);
    }

    .btn i{
      width:34px;
      height:34px;
      display:inline-grid;
      place-items:center;
      border-radius:8px;
      background:rgba(255,255,255,0.03);
      color:var(--accent-1);
      font-size:1rem;
      flex-shrink:0;
    }

    .btn:hover{ transform: translateY(-3px); background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)); }
    .btn:active{ transform: scale(0.98); background: linear-gradient(180deg, var(--accent-2), var(--accent-1)); color:#0b0712; }

    .contact-pill{
      display:inline-flex;
      gap:10px;
      align-items:center;
      margin-top:6px;
      padding:10px 18px;
      border-radius:999px;
      background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      color:rgba(255,255,255,0.75);
      font-size:0.9rem;
      border:1px solid rgba(255,255,255,0.03);
      box-shadow: 0 6px 18px rgba(2,6,23,0.45);
      z-index:12;
    }

    .about-footer{
      margin-top:auto;
      font-size:0.85rem;
      color:rgba(255,255,255,0.6);
      text-align:center;
      padding-top:8px;
    }

    /* Responsive */
    @media (max-width:880px){
      .about-btn{ left:12px; top:12px; padding:8px 10px; }
      .about-panel{ width:92vw; }
      .card{ width:92vw; max-width:420px; }
    }

    @media (prefers-reduced-motion: reduce){
      .about-panel, .about-btn, .card{ transition:none; }
      .bg::after{ -webkit-backdrop-filter:none; backdrop-filter:none; filter:none; }
    }
  </style>
</head>
<body>
  <!-- Background image (full-screen) with blur/color overlay applied via pseudo-element -->
  <div class="bg" aria-hidden="true"></div>

  <!-- About button now positioned upper-left -->
  <button class="about-btn" id="aboutBtn" aria-expanded="false" aria-controls="aboutPanel" title="About_Dip">
    <i class="fas fa-user" aria-hidden="true"></i>
    <span style="font-weight:700;letter-spacing:0.6px">About_Dip</span>
  </button>

  <!-- Slide-in About panel -->
  <aside class="about-panel" id="aboutPanel" role="region" aria-label="About Dip information" aria-hidden="true">
    <div class="about-header">
      <h3>About Dip</h3>
      <button class="about-close" id="aboutClose" aria-label="Close about panel">&times;</button>
    </div>

    <div class="about-content" id="aboutContent">
      <div class="about-row">
        <div class="label">City</div>
        <div class="value">Nagarpur, Tangail</div>
      </div>

      <div class="about-row">
        <div class="label">Email</div>
        <div class="value"><a href="mailto:diptarafder17@gmail.com" style="color:#9fe8ff;text-decoration:none">diptarafder17@gmail.com</a></div>
      </div>

      <div class="about-row">
        <div class="label">Hobby</div>
        <div class="value">Singing, games, and Taking Dreams</div>
      </div>

      <div class="about-footer">Thanks for visiting My profile</div>
    </div>
  </aside>

  <!-- Foreground stage -->
  <div class="stage" role="main">
    <div class="card" id="profileCard" aria-label="Gravity profile card">
      <div class="top-clear" aria-hidden="true"></div>

      <div class="avatar-wrap" aria-hidden="false">
        <div class="avatar" role="img" aria-label="Profile picture of Dιρ Tαɾαϝԃҽɾ">
          <img src="https://i.ibb.co/0yNGDTV0/2034-Picsart-Ai-Image-Enhancer.jpg"
               alt="Profile picture"
               onerror="this.onerror=null; this.src='https://i.ibb.co/0yNGDTV0/2034-Picsart-Ai-Image-Enhancer.jpg';"
               draggable="false">
        </div>
      </div>

      <div class="name">Dιρ Tαɾαϝԃҽɾ</div>

      <nav class="social-bar" aria-label="Social links">
        <a class="btn whatsapp" href="https://wa.me/qr/O6ZY5GWHOZNUJ1" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-whatsapp" aria-hidden="true"></i>
          <span>WhatsApp</span>
        </a>

        <a class="btn instagram" href="https://www.instagram.com/diptarafderr?igsh=MWd3c3N2bjZzZGFrbw==" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-instagram" aria-hidden="true"></i>
          <span>Instagram</span>
        </a>

        <a class="btn facebook" href="https://www.facebook.com/share/19E3s37ifs/" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-facebook-f" aria-hidden="true"></i>
          <span>Facebook</span>
        </a>
      </nav>

      <div class="contact-pill" aria-label="Phone number">
        <i class="fas fa-phone" style="color:var(--accent-1)"></i>
        <span style="font-weight:600;color:#fff">01761613854</span>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const aboutBtn = document.getElementById('aboutBtn');
      const aboutPanel = document.getElementById('aboutPanel');
      const aboutClose = document.getElementById('aboutClose');

      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function openPanel(){
        aboutPanel.classList.add('open');
        aboutPanel.setAttribute('aria-hidden', 'false');
        aboutBtn.setAttribute('aria-expanded', 'true');
        aboutClose.focus();
      }

      function closePanel(){
        aboutPanel.classList.remove('open');
        aboutPanel.setAttribute('aria-hidden', 'true');
        aboutBtn.setAttribute('aria-expanded', 'false');
        aboutBtn.focus();
      }

      aboutBtn.addEventListener('click', () => {
        const isOpen = aboutPanel.classList.contains('open');
        if(isOpen) closePanel(); else openPanel();
      });

      aboutClose.addEventListener('click', closePanel);

      // close on Escape
      document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape' && aboutPanel.classList.contains('open')) {
          closePanel();
        }
      });

      // close when clicking outside the panel
      document.addEventListener('click', (e) => {
        if(!aboutPanel.classList.contains('open')) return;
        const target = e.target;
        if(!aboutPanel.contains(target) && !aboutBtn.contains(target)){
          closePanel();
        }
      });

      if(reduce){
        aboutPanel.style.transition = 'none';
        aboutBtn.style.transition = 'none';
      }
    })();
  </script>
</body>
</html>
